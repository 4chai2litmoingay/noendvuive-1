<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No End Vui Ve</title>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* Canvas */
canvas {
    display: block;
}

/* UI */
#ui {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

button {
    padding: 14px 40px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    background: linear-gradient(to bottom, #ff4d4d, #b30000);
    color: white;
    box-shadow: 0 0 20px rgba(255,0,0,0.6);
}
</style>
</head>

<body>

<div id="ui">
    <button onclick="start()">START</button>
</div>

<audio id="music" src="./audio.mp3" loop></audio>

<script>
let scene, camera, renderer;
let photos = [];
let started = false;

/* ======================
   INIT THREE.JS
====================== */
function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        1,
        1000
    );
    camera.position.z = 100;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    loadImages();
    animate();
}

/* ======================
   LOAD IMAGES
====================== */
function loadImages() {
    const loader = new THREE.TextureLoader();

    const files = [
        './image1.jpeg',
        './image2.jpeg',
        './image3.jpeg',
        './image4.jpeg',
        './image5.jpeg'
    ];

    files.forEach((file, i) => {
        loader.load(file, texture => {
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true
            });

            const geometry = new THREE.PlaneGeometry(30, 20);
            const mesh = new THREE.Mesh(geometry, material);

            mesh.position.set(
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 60,
                (Math.random() - 0.5) * 50
            );

            scene.add(mesh);
            photos.push(mesh);
        });
    });
}

/* ======================
   ANIMATION
====================== */
function animate() {
    requestAnimationFrame(animate);

    photos.forEach(p => {
        p.rotation.y += 0.002;
        p.rotation.x += 0.001;
    });

    renderer.render(scene, camera);
}

/* ======================
   START
====================== */
function start() {
    if (started) return;
    started = true;

    document.getElementById("music").play();
    init();
}

/* ======================
   RESIZE
====================== */
window.addEventListener("resize", () => {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
